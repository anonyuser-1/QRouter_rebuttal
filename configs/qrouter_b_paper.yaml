experiment:
  name: qrouter_b_paper_aligned
  paper_default: true
  seed: 42
  output_dir: outputs/qrouter_b

model:
  image_resolution: 384
  vision_backbone_id: dinosiglip-vit-so-384px
  llm_id: xiuyul/mamba-2.8b-zephyr
  qwen_id: Qwen/Qwen2.5-VL-3B-Instruct
  sam2_config: configs/sam2/sam2_hiera_l.yaml
  sam2_checkpoint: weights/sam2_hiera_l.pt
  max_length: 2048
  projector_hidden_dim: 2048
  max_region_candidates: 32
  num_region_tokens: 32
  num_context_tokens: 128
  score_threshold: 0.5
  routing_hidden_dim: 1024
  context_modulation_init: 1.0
  use_mamba_lora: true
  use_qwen_lora: true

data:
  stage1_qa_manifests:
    - data/manifests/llava_665k.jsonl
    - data/manifests/lvis_instruct_220k.jsonl
    - data/manifests/lrv_instruct_400k.jsonl
  stage2_qa_manifests:
    - data/manifests/llava_665k.jsonl
    - data/manifests/lvis_instruct_220k.jsonl
    - data/manifests/lrv_instruct_400k.jsonl
  stage2_cis_manifests:
    - data/manifests/converseg_cis.jsonl
  qa_to_cis_ratio: [2, 1]
  num_workers: 4

optimization:
  distributed_strategy: fsdp
  stage1_steps: 20000
  stage2_steps: 10000
  global_batch_size: 128
  per_device_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.1
  warmup_ratio: 0.03
  schedule: cosine
  precision: bf16
  gradient_checkpointing: true
  cis_dice_weight: 0.25
  save_every: 1000
  log_every: 50

evaluation:
  prompt_template: "Question: {question}\nAnswer:"
  gqa_prompt_template: "Question: {question}. Answer the question using a single word or phrase.\nAnswer:"
  decoding: greedy
  temperature: 0.0
  top_p: 1.0
  num_beams: 1
  max_new_tokens: 32

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrouter-vlm"
version = "0.1.0"
description = "Question-conditioned grounding and routing for fine-grained visual question answering"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["vision-language models", "visual question answering", "visual grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.13.0",
    "causal-conv1d==1.2.0.post2",
    "einops==0.8.2",
    "hydra-core==1.3.2",
    "iopath==0.1.10",
    "mamba-ssm==1.2.2",
    "ninja==1.13.0",
    "numpy==1.26.4",
    "packaging==26.0",
    "peft==0.18.1",
    "pillow==12.2.0",
    "pyyaml==6.0.3",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "timm==1.0.26",
    "tokenizers==0.21.4",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "tqdm==4.67.3",
    "transformers==4.49.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qrouter*"]

[tool.black]
line-length = 121
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
